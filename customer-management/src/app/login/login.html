<div class="container mt-5">

    <div class="row justify-content-center">
  
      <div class="col-md-6 col-lg-4">
  
        <div class="card">
  
          <div class="card-body">
  
            <h2 class="text-center mb-4">
              Login
            </h2>
  
            <form
              (ngSubmit)="login()">
  
              <div class="mb-3">
  
                <label
                  class="form-label">
  
                  Username
  
                </label>
  
                <input
                  type="text"
                  class="form-control"
                  name="username"
                  [(ngModel)]="username"
                  required
                />
  
              </div>
  
              <div class="mb-3">
  
                <label
                  class="form-label">
  
                  Password
  
                </label>
  
                <input
                  type="password"
                  class="form-control"
                  name="password"
                  [(ngModel)]="password"
                  required
                />
  
              </div>
  
              @if (errorMessage) {
  
                <div class="alert alert-danger">
  
                  {{ errorMessage }}
  
                </div>
  
              }
  
              <button
                type="submit"
                class="btn btn-primary w-100">
  
                Login
  
              </button>
  
            </form>
  
          </div>
  
        </div>
  
      </div>
  
    </div>
  
  </div>
