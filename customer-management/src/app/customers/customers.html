<div class="container mt-4">

    <div class="d-flex justify-content-between">
  
      <h1>
        Customers
      </h1>
  
      <button
        class="btn btn-primary"
        (click)="loadCustomers()">
  
        Load Customers
  
      </button>
  
    </div>
  
    <div class="row mt-4">
  
      @for (
        customer of customers;
        track customer.id
      ) {
  
        <div class="col-md-4 mb-3">
  
          <div class="card">
  
            <div class="card-body">
  
              <h5 class="card-title">
                {{ customer.name }}
              </h5>
  
              <p class="card-text">
                {{ customer.email }}
              </p>
  
            </div>
  
          </div>
  
        </div>
  
      }
  
    </div>
  
  </div>
