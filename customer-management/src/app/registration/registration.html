<div class="container mt-4">

    <div class="row justify-content-center">
  
      <div class="col-md-6">
  
        <div class="card">
  
          <div class="card-body">
  
            <h2>
              Customer Registration
            </h2>
  
            <form
              (ngSubmit)="register()">
  
              <div class="mb-3">
  
                <label class="form-label">
                  Name
                </label>
  
                <input
                  class="form-control"
                  type="text"
                  name="name"
                  [(ngModel)]="name"
                  required
                />
  
              </div>
  
              <div class="mb-3">
  
                <label class="form-label">
                  Email
                </label>
  
                <input
                  class="form-control"
                  type="email"
                  name="email"
                  [(ngModel)]="email"
                  required
                />
  
              </div>
  
              <button
                type="submit"
                class="btn btn-primary">
  
                Register
  
              </button>
  
            </form>
  
            @if (message) {
  
              <div class="alert alert-info mt-3">
  
                {{ message }}
  
              </div>
  
            }
  
          </div>
  
        </div>
  
      </div>
  
    </div>
  
  </div>
