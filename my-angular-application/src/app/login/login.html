<h1>Login</h1>

<div>
  <label>
    Username
  </label>

  <input
    type="text"
    [(ngModel)]="username"
  />
</div>

<div>
  <label>
    Password
  </label>

  <input
    type="password"
    [(ngModel)]="password"
  />
</div>

<button (click)="login()">
  Login
</button>

@if (errorMessage) {

  <p>
    {{ errorMessage }}
  </p>

}
