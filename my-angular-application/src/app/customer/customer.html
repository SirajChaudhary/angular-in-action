<h1>Customer List</h1>

<button (click)="loadCustomers()">
  Load Customers
</button>

@if (customers.length > 0) {

  <ul>

    @for (customer of customers; track customer.id) {

      <li>
        {{ customer.id }} -
        {{ customer.name }} -
        {{ customer.email }}
      </li>

    }

  </ul>
}
